<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fig.css"></head>
<body><div id="fig"></div>
<script type="module">
import { Diagram } from "./diagram.js";
const d = new Diagram();
const state = (id, x, y, w, name, act) =>
  d.box(id, { x, y, w, cls: "state", html: `<div class="name">${name}</div>${act ? `<div class="act">${act}</div>` : ""}` });

// (a) Compliance Review panel
d.text("(a) Compliance Review panel", { x: 20, y: 10, cls: "panel-title" });
d.box("i1", { x: 277, y: 50, w: 26, cls: "init" });
state("chk", 160, 120, 260, "Checking", "spinner: both passes run");
d.box("out", { x: 20, y: 290, w: 560, h: 430, cls: "composite" });
d.text('<span class="composite-title">Showing the outcome</span>', { x: 40, y: 682 });
state("res", 40, 340, 250, "Results", "violations, planned and new components, checked files; each item open → handled");
state("clean", 310, 340, 250, "Clean", "no items; checked files listed");
state("nod", 40, 570, 250, "No changes", "nothing uncommitted, not a git repo, or ignored");
state("errA", 310, 570, 250, "Error", "message");

d.edge({ from: ["i1", "bottom"], to: ["chk", "top"], kind: "trans", label: "review requested", labelAt: { x: 390, y: 85 } });
d.edge({ from: ["chk", "bottom", 0.2], to: ["res", "top", 0.5], kind: "trans", label: "[items]", labelAt: { x: 120, y: 245 } });
d.edge({ from: ["chk", "bottom", 0.8], to: ["clean", "top", 0.5], kind: "trans", label: "[no items]", labelAt: { x: 480, y: 245 } });
d.edge({ from: ["out", "bottom", 0.5], to: ["chk", "right", 0.5], kind: "trans", via: [[null, 770], [598, null]] });
d.label("Re-run review · Check again · Try again", { x: 300, y: 770 });
d.text('<span class="note">No changes and Error are reached from Checking in the same way (empty diff, failure).</span>', { x: 20, y: 800, w: 560 });

// (b) Pre-Check panel
d.text("(b) Pre-Check panel", { x: 650, y: 10, cls: "panel-title" });
d.box("i2", { x: 897, y: 50, w: 26, cls: "init" });
state("inp", 780, 120, 260, "Prompt input", "Ctrl+Enter also checks");
state("chk2", 780, 300, 260, "Checking", "retrieve ADRs, ask the model");
state("resB", 650, 480, 300, "Result", "concerns, revised prompt, ADRs to attach; Copy prompt with context");
state("errB", 970, 480, 210, "Error", "message");

d.edge({ from: ["i2", "bottom"], to: ["inp", "top"], kind: "trans" });
d.edge({ from: ["inp", "bottom"], to: ["chk2", "top"], kind: "trans", label: "Check Architecture" });
d.edge({ from: ["chk2", "bottom", 0.15], to: ["resB", "top", 0.45], kind: "trans" });
d.edge({ from: ["chk2", "bottom", 0.85], to: ["errB", "top", 0.5], kind: "trans", label: "[failure]", labelAt: { x: 1080, y: 440 } });
d.edge({ from: ["resB", "left", 0.5], to: ["inp", "left", 0.5], kind: "trans", via: [[630, null]] });
d.label("Revise prompt ·<br>Check another ·<br>Use this prompt", { x: 712, y: 400 }, "wrap");
d.edge({ from: ["errB", "right", 0.5], to: ["inp", "right", 0.5], kind: "trans", via: [[1190, null]] });
d.label("Back to<br>prompt", { x: 1120, y: 250 }, "wrap");

d.render();
</script>
</body></html>
