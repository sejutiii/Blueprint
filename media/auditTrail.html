<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <title>BluePrint: Audit Trail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      padding: 28px 24px 60px;
    }
    h2 { font-size: 15px; font-weight: 600; }

    .spinner-wrap { text-align: center; padding: 60px 0; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--vscode-input-border);
      border-top-color: var(--vscode-button-background);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-wrap p { color: var(--vscode-descriptionForeground); font-size: 12px; }

    .empty-wrap { text-align: center; padding: 60px 0; }
    .empty-icon { font-size: 36px; opacity: 0.3; margin-bottom: 14px; }
    .empty-wrap p { color: var(--vscode-descriptionForeground); font-size: 12px; line-height: 1.7; }

    .trail-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 22px;
    }
    .count-badge {
      font-size: 11px; font-weight: 600;
      padding: 2px 10px; border-radius: 12px;
      background: var(--vscode-badge-background);
      color: var(--vscode-badge-foreground);
    }

    .adr-card {
      border-radius: 5px;
      border-left: 3px solid var(--vscode-panel-border, var(--vscode-input-border));
      border-top: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      border-right: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .adr-card.accepted   { border-left-color: var(--vscode-testing-iconPassed,  #4caf50); }
    .adr-card.proposed   { border-left-color: var(--vscode-editorInfo-foreground, #2196f3); }
    .adr-card.deprecated { border-left-color: var(--vscode-disabledForeground, #888); }
    .adr-card.superseded { border-left-color: #e6a817; }

    .card-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; flex-wrap: wrap;
    }
    .status-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 3px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-accepted   { background: rgba(76,175,80,0.15);  color: var(--vscode-testing-iconPassed, #4caf50); }
    .badge-proposed   { background: rgba(33,150,243,0.15); color: var(--vscode-editorInfo-foreground, #2196f3); }
    .badge-deprecated { background: rgba(136,136,136,0.15); color: var(--vscode-disabledForeground, #888); }
    .badge-superseded { background: rgba(230,168,23,0.15); color: #e6a817; }

    .adr-id {
      font-family: var(--vscode-editor-font-family);
      font-size: 11px; opacity: 0.6;
    }
    .adr-date {
      font-size: 11px; opacity: 0.5;
      margin-left: auto;
    }
    .btn-open {
      padding: 3px 10px;
      border: 1px solid var(--vscode-button-border, var(--vscode-input-border));
      border-radius: 3px; background: transparent;
      color: var(--vscode-foreground); font-family: inherit; font-size: 11px;
      cursor: pointer; white-space: nowrap;
    }
    .btn-open:hover { background: var(--vscode-list-hoverBackground); }

    .adr-title {
      font-size: 13px; font-weight: 600; margin-bottom: 6px;
      line-height: 1.4;
    }
    .adr-decision {
      font-size: 12px; color: var(--vscode-descriptionForeground);
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="screen-loading">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p>Loading decisions…</p>
    </div>
  </div>

  <!-- Empty -->
  <div id="screen-empty" class="hidden">
    <div class="empty-wrap">
      <div class="empty-icon">📋</div>
      <h2 style="margin-bottom:10px">No decisions recorded yet</h2>
      <p>Architectural decisions appear here after you complete<br>the initialization wizard or run a compliance review.</p>
    </div>
  </div>

  <!-- Trail -->
  <div id="screen-trail" class="hidden">
    <div class="trail-header">
      <h2>Decision Audit Trail</h2>
      <span id="trail-count" class="count-badge"></span>
    </div>
    <div id="trail-list"></div>
  </div>

<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();

  let adrMap = {};

  function showScreen(id) {
    ['screen-loading','screen-empty','screen-trail'].forEach(s =>
      document.getElementById(s).classList.add('hidden')
    );
    document.getElementById(id).classList.remove('hidden');
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildCardHtml(adr) {
    const status  = (adr.status || 'proposed').toLowerCase();
    const date    = new Date(adr.timestamp);
    const dateStr = date.toLocaleDateString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
    const decision = (adr.decision || '');

    return `<div class="adr-card ${esc(status)}">
      <div class="card-header">
        <span class="status-badge badge-${esc(status)}">${esc(status)}</span>
        <span class="adr-id">ADR-${esc(adr.id)}</span>
        <span class="adr-date">${esc(dateStr)}</span>
        <button class="btn-open" data-adr-id="${esc(adr.id)}">Open</button>
      </div>
      <div class="adr-title">${esc(adr.title)}</div>
      <div class="adr-decision">${esc(decision)}</div>
    </div>`;
  }

  function renderTrail(adrs) {
    if (!adrs || adrs.length === 0) {
      showScreen('screen-empty');
      return;
    }

    adrMap = {};
    adrs.forEach(a => { adrMap[a.id] = a; });

    document.getElementById('trail-count').textContent =
      adrs.length + ' decision' + (adrs.length !== 1 ? 's' : '');
    document.getElementById('trail-list').innerHTML = adrs.map(buildCardHtml).join('');

    document.querySelectorAll('.btn-open').forEach(btn => {
      btn.addEventListener('click', () => {
        const adr = adrMap[btn.dataset.adrId];
        if (adr) { vscode.postMessage({ command: 'openAdr', adr }); }
      });
    });

    showScreen('screen-trail');
  }

  window.addEventListener('message', ({ data: msg }) => {
    if (msg.command === 'load') {
      renderTrail(msg.adrs);
    }
  });

  // Signal to the extension host that the webview is ready to receive data
  vscode.postMessage({ command: 'ready' });
</script>
</body>
</html>
