<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <title>BluePrint: Audit Trail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      padding: 28px 24px 60px;
    }
    h2 { font-size: 15px; font-weight: 600; }

    .spinner-wrap { text-align: center; padding: 60px 0; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--vscode-input-border);
      border-top-color: var(--vscode-button-background);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-wrap p { color: var(--vscode-descriptionForeground); font-size: 12px; }

    .empty-wrap { text-align: center; padding: 60px 0; }
    .empty-icon { font-size: 36px; opacity: 0.3; margin-bottom: 14px; }
    .empty-wrap p { color: var(--vscode-descriptionForeground); font-size: 12px; line-height: 1.7; }
    .no-match { color: var(--vscode-descriptionForeground); font-size: 12px; font-style: italic; padding: 18px 0; }

    .trail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }

    /* Tabs + toolbar */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-input-border)); margin-bottom: 14px; }
    .tab {
      padding: 6px 12px; font-size: 12px; cursor: pointer; border: none; background: transparent;
      color: var(--vscode-descriptionForeground); border-bottom: 2px solid transparent; font-family: inherit;
    }
    .tab.active { color: var(--vscode-foreground); border-bottom-color: var(--vscode-button-background); }
    .tab .count { margin-left: 6px; font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar input[type="search"] {
      flex: 1; min-width: 180px;
      background: var(--vscode-input-background); color: var(--vscode-input-foreground);
      border: 1px solid var(--vscode-input-border); border-radius: 3px;
      padding: 5px 9px; font-family: inherit; font-size: 12px; outline: none;
    }
    .toolbar input[type="search"]:focus { border-color: var(--vscode-focusBorder); }
    .chip {
      padding: 3px 10px; font-size: 11px; border-radius: 12px; cursor: pointer; font-family: inherit;
      border: 1px solid var(--vscode-input-border); background: transparent; color: var(--vscode-foreground);
    }
    .chip.active { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border-color: transparent; }

    /* Cards */
    .card {
      border-radius: 5px;
      border-left: 3px solid var(--vscode-panel-border, var(--vscode-input-border));
      border-top: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      border-right: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      border-bottom: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card.accepted   { border-left-color: var(--vscode-testing-iconPassed, #4caf50); }
    .card.proposed   { border-left-color: #e6a817; }
    .card.rejected   { border-left-color: var(--vscode-inputValidation-errorBorder, #f44336); }
    .card.deprecated { border-left-color: var(--vscode-disabledForeground, #888); }
    .card.superseded { border-left-color: var(--vscode-editorInfo-foreground, #2196f3); }

    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .status-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 3px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .badge-accepted   { background: rgba(76,175,80,0.15);  color: var(--vscode-testing-iconPassed, #4caf50); }
    .badge-proposed   { background: rgba(230,168,23,0.15); color: #e6a817; }
    .badge-rejected   { background: rgba(244,67,54,0.15);  color: #f44336; }
    .badge-deprecated { background: rgba(136,136,136,0.15); color: var(--vscode-disabledForeground, #888); }
    .badge-superseded { background: rgba(33,150,243,0.15); color: var(--vscode-editorInfo-foreground, #2196f3); }
    .badge-event      { background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }

    .mono { font-family: var(--vscode-editor-font-family); font-size: 11px; opacity: 0.6; }
    .date { font-size: 11px; opacity: 0.5; margin-left: auto; }
    .btn-open {
      padding: 3px 10px;
      border: 1px solid var(--vscode-button-border, var(--vscode-input-border));
      border-radius: 3px; background: transparent;
      color: var(--vscode-foreground); font-family: inherit; font-size: 11px;
      cursor: pointer; white-space: nowrap;
    }
    .btn-open:hover { background: var(--vscode-list-hoverBackground); }

    .title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .decision {
      font-size: 12px; color: var(--vscode-descriptionForeground); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .meta { font-size: 11px; color: var(--vscode-descriptionForeground); margin-top: 8px; }
    .review-note {
      font-size: 12px; margin-top: 8px; padding: 6px 10px; border-radius: 4px; line-height: 1.5;
      background: rgba(244,67,54,0.08); border-left: 2px solid var(--vscode-inputValidation-errorBorder, #f44336);
    }
    .review-note.ok { background: rgba(76,175,80,0.08); border-left-color: var(--vscode-testing-iconPassed, #4caf50); }

    .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .file-link {
      font-family: var(--vscode-editor-font-family); font-size: 11px; cursor: pointer;
      padding: 1px 7px; border-radius: 3px; border: none;
      background: var(--vscode-textCodeBlock-background, rgba(127,127,127,0.12));
      color: var(--vscode-textLink-foreground);
    }
    .file-link:hover { text-decoration: underline; }

    details.history { margin-top: 8px; font-size: 11px; }
    details.history summary { cursor: pointer; color: var(--vscode-descriptionForeground); user-select: none; }
    details.history ol { list-style: none; margin-top: 6px; padding-left: 10px; border-left: 1px solid var(--vscode-panel-border, var(--vscode-input-border)); }
    details.history li { padding: 2px 0 2px 8px; color: var(--vscode-descriptionForeground); }

    .event-row { display: flex; gap: 10px; align-items: flex-start; }
    .event-icon { width: 18px; text-align: center; opacity: 0.8; flex-shrink: 0; }
    .event-body { flex: 1; min-width: 0; }
    .event-summary { font-size: 12px; line-height: 1.5; }
    .violations { margin-top: 6px; padding-left: 16px; font-size: 11px; color: var(--vscode-descriptionForeground); line-height: 1.5; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="screen-loading">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p>Loading decisions…</p>
    </div>
  </div>

  <!-- Empty -->
  <div id="screen-empty" class="hidden">
    <div class="empty-wrap">
      <div class="empty-icon">📋</div>
      <h2 style="margin-bottom:10px">No decisions recorded yet</h2>
      <p>Architectural decisions appear here after you complete<br>the initialization wizard or run a compliance review.</p>
    </div>
  </div>

  <!-- Trail -->
  <div id="screen-trail" class="hidden">
    <div class="trail-header">
      <h2>Decision Audit Trail</h2>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="decisions">Decisions<span class="count" id="count-decisions">0</span></button>
      <button class="tab" data-tab="activity">Activity<span class="count" id="count-activity">0</span></button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search titles, decisions, files, people…" />
      <div id="filters-decisions">
        <button class="chip active" data-status="all">All</button>
        <button class="chip" data-status="proposed">Pending</button>
        <button class="chip" data-status="accepted">Accepted</button>
        <button class="chip" data-status="rejected">Rejected</button>
        <button class="chip" data-status="retired">Retired</button>
      </div>
      <div id="filters-activity" class="hidden">
        <button class="chip active" data-group="all">All</button>
        <button class="chip" data-group="decisions">Decisions</button>
        <button class="chip" data-group="reviews">Reviews</button>
        <button class="chip" data-group="prechecks">Pre-checks</button>
        <button class="chip" data-group="arch">ARCH.md</button>
      </div>
    </div>

    <div id="list-decisions"></div>
    <div id="list-activity" class="hidden"></div>
  </div>

<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();

  let adrs = [];
  let entries = [];
  let adrMap = {};
  const state = { tab: 'decisions', query: '', status: 'all', group: 'all' };

  const STATUS_LABEL = { proposed: 'pending', accepted: 'accepted', rejected: 'rejected', deprecated: 'deprecated', superseded: 'superseded' };

  const EVENT_INFO = {
    adr_created:        { icon: '✚', label: 'ADR recorded',       group: 'decisions' },
    adr_proposed:       { icon: '⧗', label: 'ADR proposed',       group: 'decisions' },
    adr_approved:       { icon: '✓', label: 'ADR approved',       group: 'decisions' },
    adr_rejected:       { icon: '✕', label: 'ADR rejected',       group: 'decisions' },
    adr_superseded:     { icon: '⇢', label: 'ADR superseded',     group: 'decisions' },
    compliance_check:   { icon: '⚑', label: 'Compliance review',  group: 'reviews' },
    extension_detected: { icon: '◇', label: 'New component',      group: 'reviews' },
    pre_check:          { icon: '⛨', label: 'Pre-check',          group: 'prechecks' },
    arch_updated:       { icon: '✎', label: 'ARCH.md updated',    group: 'arch' },
    arch_reverted:      { icon: '↺', label: 'ARCH.md reverted',   group: 'arch' },
    roles_updated:      { icon: '⚇', label: 'Roles updated',      group: 'decisions' },
  };

  function showScreen(id) {
    ['screen-loading', 'screen-empty', 'screen-trail'].forEach(s =>
      document.getElementById(s).classList.add('hidden')
    );
    document.getElementById(id).classList.remove('hidden');
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  }

  function filesHtml(files) {
    if (!files || !files.length) return '';
    return `<div class="files">${files.map(f =>
      `<button class="file-link" data-file="${esc(f)}" title="Open ${esc(f)}">${esc(f)}</button>`).join('')}</div>`;
  }

  // Events linked to an ADR, oldest first, form its history; their files are the code changes behind it.
  function eventsFor(adrId) {
    return entries.filter(e => e.adrId === adrId).slice().reverse();
  }

  function matches(haystack) {
    const q = state.query.trim().toLowerCase();
    return !q || haystack.toLowerCase().includes(q);
  }

  function decisionCardHtml(adr) {
    const status = STATUS_LABEL[adr.status] ? adr.status : 'proposed';
    const history = eventsFor(adr.id);
    const files = [...new Set(history.flatMap(e => e.changedFiles || []))];

    const meta = [
      adr.proposedBy ? `Proposed by ${esc(adr.proposedBy)}` : '',
      adr.reviewedBy && adr.reviewedBy !== adr.proposedBy ? `reviewed by ${esc(adr.reviewedBy)}` : '',
    ].filter(Boolean).join(' · ');

    const note = adr.reviewNote && !/^Auto-approved/.test(adr.reviewNote)
      ? `<div class="review-note ${adr.status === 'rejected' ? '' : 'ok'}"><strong>Review:</strong> ${esc(adr.reviewNote)}</div>`
      : '';

    const historyHtml = history.length
      ? `<details class="history"><summary>History (${history.length})</summary><ol>${
          history.map(e => `<li>${esc(fmtDate(e.timestamp))} · ${esc((EVENT_INFO[e.eventType] || {}).label || e.eventType)}${e.actor ? ' by ' + esc(e.actor) : ''}</li>`).join('')
        }</ol></details>`
      : '';

    return `<div class="card ${esc(status)}">
      <div class="card-header">
        <span class="status-badge badge-${esc(status)}">${esc(STATUS_LABEL[status])}</span>
        <span class="mono">ADR-${esc(adr.id)}</span>
        <span class="date">${esc(fmtDate(adr.timestamp))}</span>
        <button class="btn-open" data-adr-id="${esc(adr.id)}">Open</button>
      </div>
      <div class="title">${esc(adr.title)}</div>
      <div class="decision">${esc(adr.decision)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
      ${note}
      ${filesHtml(files)}
      ${historyHtml}
    </div>`;
  }

  function activityCardHtml(e) {
    const info = EVENT_INFO[e.eventType] || { icon: '•', label: e.eventType };
    const violations = e.complianceResult && e.complianceResult.violations && e.complianceResult.violations.length
      ? `<ul class="violations">${e.complianceResult.violations.map(v =>
          `<li>[${esc(String(v.severity || '').toUpperCase())}] ${esc(v.description)}</li>`).join('')}</ul>`
      : '';
    const adr = e.adrId ? adrMap[e.adrId] : null;
    return `<div class="card">
      <div class="event-row">
        <span class="event-icon">${info.icon}</span>
        <div class="event-body">
          <div class="card-header" style="margin-bottom:4px">
            <span class="status-badge badge-event">${esc(info.label)}</span>
            ${e.actor ? `<span class="mono">${esc(e.actor)}</span>` : ''}
            <span class="date">${esc(fmtDate(e.timestamp))}</span>
            ${adr ? `<button class="btn-open" data-adr-id="${esc(adr.id)}">ADR-${esc(adr.id)}</button>` : ''}
          </div>
          <div class="event-summary">${esc(e.summary)}</div>
          ${violations}
          ${filesHtml(e.changedFiles)}
        </div>
      </div>
    </div>`;
  }

  function adrSearchText(adr) {
    const files = eventsFor(adr.id).flatMap(e => e.changedFiles || []);
    return [adr.id, 'ADR-' + adr.id, adr.title, adr.context, adr.decision, adr.consequences,
            adr.status, STATUS_LABEL[adr.status], adr.proposedBy, adr.reviewedBy, adr.reviewNote, ...files].join(' ');
  }

  function entrySearchText(e) {
    const vs = ((e.complianceResult || {}).violations || []).map(v => v.description);
    return [e.summary, e.actor, e.adrId ? 'ADR-' + e.adrId : '', (EVENT_INFO[e.eventType] || {}).label,
            ...(e.changedFiles || []), ...vs].join(' ');
  }

  function render() {
    const statusOk = (a) =>
      state.status === 'all' ||
      (state.status === 'retired' ? (a.status === 'deprecated' || a.status === 'superseded') : a.status === state.status);
    const shownAdrs = adrs.filter(a => statusOk(a) && matches(adrSearchText(a)));

    const groupOk = (e) => state.group === 'all' || (EVENT_INFO[e.eventType] || {}).group === state.group;
    const shownEntries = entries.filter(e => groupOk(e) && matches(entrySearchText(e)));

    document.getElementById('count-decisions').textContent = String(adrs.length);
    document.getElementById('count-activity').textContent = String(entries.length);

    document.getElementById('list-decisions').innerHTML = shownAdrs.length
      ? shownAdrs.map(decisionCardHtml).join('')
      : `<p class="no-match">${adrs.length ? 'No decisions match.' : 'No ADRs yet.'}</p>`;

    document.getElementById('list-activity').innerHTML = shownEntries.length
      ? shownEntries.map(activityCardHtml).join('')
      : `<p class="no-match">${entries.length ? 'No activity matches.' : 'No activity recorded yet. Events are logged from this version of BluePrint onwards.'}</p>`;
  }

  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('list-decisions').classList.toggle('hidden', tab !== 'decisions');
    document.getElementById('list-activity').classList.toggle('hidden', tab !== 'activity');
    document.getElementById('filters-decisions').classList.toggle('hidden', tab !== 'decisions');
    document.getElementById('filters-activity').classList.toggle('hidden', tab !== 'activity');
    vscode.setState(state);
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTab(t.dataset.tab)));

  document.getElementById('search').addEventListener('input', (e) => {
    state.query = e.target.value;
    vscode.setState(state);
    render();
  });

  function wireChips(containerId, key, attr) {
    document.getElementById(containerId).addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      state[key] = chip.dataset[attr];
      document.querySelectorAll(`#${containerId} .chip`).forEach(c => c.classList.toggle('active', c === chip));
      vscode.setState(state);
      render();
    });
  }
  wireChips('filters-decisions', 'status', 'status');
  wireChips('filters-activity', 'group', 'group');

  document.body.addEventListener('click', (e) => {
    const open = e.target.closest('button[data-adr-id]');
    if (open) {
      const adr = adrMap[open.dataset.adrId];
      if (adr) { vscode.postMessage({ command: 'openAdr', adr }); }
      return;
    }
    const file = e.target.closest('button[data-file]');
    if (file) { vscode.postMessage({ command: 'openFile', path: file.dataset.file }); }
  });

  // Restore tab / search / filters across reloads of the webview.
  const saved = vscode.getState();
  if (saved) {
    Object.assign(state, saved);
    document.getElementById('search').value = state.query || '';
    document.querySelectorAll('#filters-decisions .chip').forEach(c => c.classList.toggle('active', c.dataset.status === state.status));
    document.querySelectorAll('#filters-activity .chip').forEach(c => c.classList.toggle('active', c.dataset.group === state.group));
  }
  setTab(state.tab);

  window.addEventListener('message', ({ data: msg }) => {
    if (msg.command !== 'load') return;
    adrs = msg.adrs || [];
    entries = msg.entries || [];
    adrMap = {};
    adrs.forEach(a => { adrMap[a.id] = a; });

    if (!adrs.length && !entries.length) {
      showScreen('screen-empty');
      return;
    }
    render();
    showScreen('screen-trail');
  });

  // Signal to the extension host that the webview is ready to receive data (T53)
  vscode.postMessage({ command: 'ready' });
</script>
</body>
</html>
