<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <title>BluePrint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      padding: 32px 24px 60px;
      max-width: 520px;
    }

    .hub-header { margin-bottom: 28px; }
    .hub-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .hub-subtitle { font-size: 12px; color: var(--vscode-descriptionForeground); line-height: 1.5; }

    .git-reminder {
      background: var(--vscode-textBlockQuote-background);
      border-left: 3px solid var(--vscode-textBlockQuote-border, var(--vscode-focusBorder));
      border-radius: 0 4px 4px 0;
      padding: 11px 14px;
      margin-bottom: 28px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--vscode-descriptionForeground);
    }
    .git-reminder-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; opacity: 0.65;
      display: block; margin-bottom: 4px;
      color: var(--vscode-foreground);
    }
    code {
      font-family: var(--vscode-editor-font-family);
      font-size: 11px;
      background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.15));
      padding: 1px 5px; border-radius: 3px;
    }

    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; opacity: 0.5;
      margin-bottom: 10px;
    }

    .action-card {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 16px 18px;
      border-radius: 6px;
      border: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      cursor: pointer; margin-bottom: 10px;
      font-family: inherit; color: var(--vscode-foreground);
      text-align: left;
    }
    .action-card:hover {
      background: var(--vscode-list-hoverBackground);
      border-color: var(--vscode-focusBorder);
    }
    .action-card:active { opacity: 0.75; }

    .card-icon {
      width: 42px; height: 42px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .icon-violations { background: rgba(244, 67,  54,  0.12); }
    .icon-extensions { background: rgba(33,  150, 243, 0.12); }
    .icon-precheck   { background: rgba(76,  175, 80,  0.12); }
    .icon-decision   { background: rgba(156, 39,  176, 0.12); }

    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .card-desc  { font-size: 11px; color: var(--vscode-descriptionForeground); line-height: 1.5; }

    .card-arrow { font-size: 16px; opacity: 0.35; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="hub-header">
    <div class="hub-title">BluePrint</div>
    <div class="hub-subtitle">Architecture-aware development assistant</div>
  </div>

  <div class="git-reminder">
    <span class="git-reminder-label">Before you run</span>
    Modified files are picked up automatically. <strong>New files</strong> must be staged
    first — run <code>git add &lt;file&gt;</code> before checking.
    Always run checks <strong>before</strong> <code>git commit</code>.
  </div>

  <div class="section-label">What would you like to do?</div>

  <button class="action-card" id="btn-violations" title="Check whether your code changes break existing architecture constraints or ADRs">
    <div class="card-icon icon-violations">⚠</div>
    <div class="card-body">
      <div class="card-title">Check for Violations</div>
      <div class="card-desc">Detect code changes that break your architecture constraints or recorded decisions.</div>
    </div>
    <span class="card-arrow">›</span>
  </button>

  <button class="action-card" id="btn-extensions" title="Detect new structural components introduced by your changes that are not yet in ARCH.md">
    <div class="card-icon icon-extensions">◈</div>
    <div class="card-body">
      <div class="card-title">Check for Extensions</div>
      <div class="card-desc">Detect new structural components in your changes that are not yet documented in your architecture.</div>
    </div>
    <span class="card-arrow">›</span>
  </button>

  <button class="action-card" id="btn-precheck" title="Check your AI coding prompt against architecture constraints before writing any code">
    <div class="card-icon icon-precheck">◎</div>
    <div class="card-body">
      <div class="card-title">Pre-Check Prompt</div>
      <div class="card-desc">Check your AI coding prompt against architecture constraints before writing any code.</div>
    </div>
    <span class="card-arrow">›</span>
  </button>

  <button class="action-card" id="btn-decision" title="Record a decision, a new constraint, or a changed requirement as an ADR">
    <div class="card-icon icon-decision">✚</div>
    <div class="card-body">
      <div class="card-title">Add Decision</div>
      <div class="card-desc">Describe a decision or a changed requirement in your own words. BluePrint drafts the ADR and updates ARCH.md.</div>
    </div>
    <span class="card-arrow">›</span>
  </button>

<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();

  document.getElementById('btn-violations').addEventListener('click', () => {
    vscode.postMessage({ command: 'openViolations' });
  });
  document.getElementById('btn-extensions').addEventListener('click', () => {
    vscode.postMessage({ command: 'openExtensions' });
  });
  document.getElementById('btn-precheck').addEventListener('click', () => {
    vscode.postMessage({ command: 'openPreCheck' });
  });
  document.getElementById('btn-decision').addEventListener('click', () => {
    vscode.postMessage({ command: 'openAddDecision' });
  });
</script>
</body>
</html>
