<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <title>BluePrint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      padding: 32px 24px 60px;
      max-width: 520px;
    }

    .hub-header { margin-bottom: 28px; }
    .hub-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .hub-subtitle { font-size: 12px; color: var(--vscode-descriptionForeground); line-height: 1.5; }

    .git-reminder {
      background: var(--vscode-textBlockQuote-background);
      border-left: 3px solid var(--vscode-textBlockQuote-border, var(--vscode-focusBorder));
      border-radius: 0 4px 4px 0;
      padding: 11px 14px;
      margin-bottom: 28px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--vscode-descriptionForeground);
    }
    .git-reminder-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; opacity: 0.65;
      display: block; margin-bottom: 4px;
      color: var(--vscode-foreground);
    }
    code {
      font-family: var(--vscode-editor-font-family);
      font-size: 11px;
      background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.15));
      padding: 1px 5px; border-radius: 3px;
    }

    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
      text-transform: uppercase; opacity: 0.5;
      margin-bottom: 10px;
    }

    .action-card {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 16px 18px;
      border-radius: 6px;
      border: 1px solid var(--vscode-panel-border, var(--vscode-input-border));
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      cursor: pointer; margin-bottom: 10px;
      font-family: inherit; color: var(--vscode-foreground);
      text-align: left;
    }
    .action-card:hover {
      background: var(--vscode-list-hoverBackground);
      border-color: var(--vscode-focusBorder);
    }
    .action-card:active { opacity: 0.75; }

    .card-icon {
      width: 42px; height: 42px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .icon-review    { background: rgba(244, 67,  54,  0.12); }
    .icon-precheck  { background: rgba(76,  175, 80,  0.12); }
    .icon-arch      { background: rgba(33,  150, 243, 0.12); }
    .icon-decision  { background: rgba(156, 39,  176, 0.12); }
    .icon-init      { background: rgba(0,   122, 204, 0.12); }

    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .card-desc  { font-size: 11px; color: var(--vscode-descriptionForeground); line-height: 1.5; }

    .card-arrow { font-size: 16px; opacity: 0.35; flex-shrink: 0; }

    /* Pending approvals: the one thing on the Hub that may need someone to act */
    .pending-banner {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 14px; margin-bottom: 22px;
      border-radius: 5px; border: 1px solid rgba(230, 168, 23, 0.45);
      background: rgba(230, 168, 23, 0.12);
      font-family: inherit; font-size: 12px; color: var(--vscode-foreground);
      text-align: left; cursor: pointer;
    }
    .pending-banner:hover { border-color: var(--vscode-focusBorder); }
    .pending-banner .card-arrow { margin-left: auto; }

    .links { margin-top: 22px; display: flex; flex-direction: column; gap: 2px; }
    .link {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 4px; border: none;
      background: transparent; color: var(--vscode-textLink-foreground);
      font-family: inherit; font-size: 12px; text-align: left; cursor: pointer;
    }
    .link:hover { background: var(--vscode-list-hoverBackground); color: var(--vscode-textLink-activeForeground); }
    .link-icon { width: 16px; text-align: center; opacity: 0.8; }
    .link-note { color: var(--vscode-descriptionForeground); font-size: 11px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="hub-header">
    <div class="hub-title">BluePrint</div>
    <div class="hub-subtitle" id="subtitle">Architecture-aware development assistant</div>
  </div>

  <!-- Shown until the extension reports that the project is initialized -->
  <div id="view-uninitialized" class="hidden">
    <div class="section-label">Get started</div>
    <button class="action-card" data-command="init" title="Set up BluePrint for this project: LLM provider, team roles and ARCH.md">
      <div class="card-icon icon-init">◇</div>
      <div class="card-body">
        <div class="card-title">Initialize BluePrint</div>
        <div class="card-desc">BluePrint isn't set up in this project yet. Choose an LLM provider, set up roles and generate ARCH.md for this codebase.</div>
      </div>
      <span class="card-arrow">›</span>
    </button>
  </div>

  <div id="view-initialized" class="hidden">
    <button class="pending-banner hidden" id="pending" data-command="openApprovals">
      <span>⧗</span>
      <span id="pending-text"></span>
      <span class="card-arrow">›</span>
    </button>

    <div class="git-reminder">
      <span class="git-reminder-label">Before you run</span>
      Reviews look at everything not yet committed: changed, new, deleted and renamed files
      (files ignored by <code>.gitignore</code> are skipped).
      Run checks <strong>before</strong> <code>git commit</code>.
    </div>

    <div class="section-label">What would you like to do?</div>

    <button class="action-card" data-command="openReview" title="Check your uncommitted changes against ARCH.md and your decisions">
      <div class="card-icon icon-review">⚑</div>
      <div class="card-body">
        <div class="card-title">Review my changes</div>
        <div class="card-desc">Find changes that break your constraints or decisions, and new components not yet in ARCH.md.</div>
      </div>
      <span class="card-arrow">›</span>
    </button>

    <button class="action-card" data-command="openPreCheck" title="Check your AI coding prompt against architecture constraints before writing any code">
      <div class="card-icon icon-precheck">◎</div>
      <div class="card-body">
        <div class="card-title">Pre-check a prompt</div>
        <div class="card-desc">Check an AI coding prompt against your architecture before any code is written.</div>
      </div>
      <span class="card-arrow">›</span>
    </button>

    <button class="action-card" data-command="viewArch" title="Open the rendered ARCH.md with recent changes highlighted">
      <div class="card-icon icon-arch">▤</div>
      <div class="card-body">
        <div class="card-title">View architecture</div>
        <div class="card-desc">Read ARCH.md with recent changes highlighted; edit, revert or regenerate it.</div>
      </div>
      <span class="card-arrow">›</span>
    </button>

    <button class="action-card" data-command="openAddDecision" title="Record a decision, a new constraint, or a changed requirement as an ADR">
      <div class="card-icon icon-decision">✚</div>
      <div class="card-body">
        <div class="card-title">Add a decision</div>
        <div class="card-desc">Describe a decision or a changed requirement in your own words. BluePrint drafts the ADR and updates ARCH.md.</div>
      </div>
      <span class="card-arrow">›</span>
    </button>

    <div class="links">
      <button class="link" data-command="viewAuditTrail"><span class="link-icon">↻</span>Audit trail <span class="link-note">— every review, decision and ARCH.md change</span></button>
      <button class="link" data-command="configureRoles"><span class="link-icon">⚇</span>Team &amp; roles <span class="link-note" id="role-note"></span></button>
      <button class="link" data-command="changeProvider"><span class="link-icon">⚿</span>Change LLM provider / API key</button>
    </div>
  </div>

<script nonce="{{nonce}}">
  const vscode = acquireVsCodeApi();

  window.addEventListener('message', ({ data: msg }) => {
    if (msg.command !== 'state') return;
    document.getElementById('view-initialized').classList.toggle('hidden', !msg.initialized);
    document.getElementById('view-uninitialized').classList.toggle('hidden', msg.initialized);

    const role = msg.role === 'developer' ? 'Developer' : 'Architect';
    document.getElementById('subtitle').textContent = msg.identity
      ? `${msg.identity} · ${role}`
      : 'Architecture-aware development assistant';
    document.getElementById('role-note').textContent = msg.rolesConfigured
      ? `— you are ${role === 'Architect' ? 'an Architect' : 'a Developer'}`
      : '— not set up: everyone is an Architect';

    const pending = msg.pending || 0;
    document.getElementById('pending').classList.toggle('hidden', !pending);
    const decisions = `${pending} decision${pending === 1 ? '' : 's'}`;
    document.getElementById('pending-text').textContent = msg.role === 'developer'
      ? `${decisions} waiting for an Architect's approval`
      : `${decisions} need${pending === 1 ? 's' : ''} your approval`;
  });

  document.body.addEventListener('click', (e) => {
    const target = e.target.closest('[data-command]');
    if (target) vscode.postMessage({ command: target.dataset.command });
  });

  vscode.postMessage({ command: 'ready' });
</script>
</body>
</html>
